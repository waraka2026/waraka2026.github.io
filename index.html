<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="waraka｜AI・Web制作・写真・YouTube・LINEスタンプなど、好奇心を形にするポートフォリオ。" />
  <title>waraka | portfolio</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#25243d;font-family:system-ui,sans-serif}
  </style>
</head>
<body>
  <p>Loading portfolio...</p>
  <script>
    (function(){
      var version='20260913-shiori-copy';
      fetch('index-original.html?v='+version,{cache:'no-store'})
        .then(function(response){return response.text();})
        .then(function(html){
          var oldIntro='<p>ClaudeCodeで開発した読書管理Webアプリ。Firebase / VS Code / GitHub などを使用し、GitHubアカウントまたはGoogleアカウントでログインして使えます。</p>';
          var newIntro='<p><strong>読書メモをまとめて管理できるWebアプリ。</strong><br>ClaudeCodeで、AIと一緒に1から開発しました。</p>';
          var oldFeatures='<div class="app-features"><p><strong>📚 ISBN自動登録：</strong>番号を入力するだけで書名・著者・表紙を自動取得。手入力の手間ゼロ。</p>\n<p><strong>🗂️ 読書ステータス管理：</strong>「読みたい・読書中・積読・読了」の4段階で本を整理。進捗バーで何%読んだか確認できます。</p>\n<p><strong>✏️ カスタマイズできるメモ：</strong>ページ番号・重要度タグつきでメモを記録。本の詳細画面でメモの並び替えやテキストのコピーも可能。メモの種類名は自分好みに変更できます。</p>\n<p><strong>📖 本棚ビュー：</strong>グリッド表示に切り替えると本の表紙が並んで本棚のように眺められます。</p>\n<p><strong>☁️ Googleアカウントで同期：</strong>サインインするだけでデータを自動同期。機種変更後もすべての記録が引き継げます。</p>\n<p><strong>🔍 検索・フィルター：</strong>タイトル・著者・タグで検索。ステータス絞り込みと並び替えで見たい本をすぐ見つけられます。</p></div>';
          var newFeatures='<div class="app-features"><p><strong>📚 ISBN自動登録：</strong>番号入力だけで書名・著者・表紙を自動取得。</p>\n<p><strong>🗂️ 読書管理：</strong>「読みたい・読書中・積読・読了」を整理。</p>\n<p><strong>✏️ メモ保存：</strong>ページ番号や重要度つきで記録できます。</p></div>';
          var extraCss='\n    /* compact Shiori description */\n    .project-card.brown .project-info p{line-height:1.65;}\n    .project-card.brown .app-features{margin:8px 0 12px;}\n    .project-card.brown .app-features p{margin-bottom:6px;font-size:12px;line-height:1.55;}\n';
          html=html.replace(oldIntro,newIntro).replace(oldFeatures,newFeatures).replace('</style>',extraCss+'</style>');
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function(){
          location.href='index-original.html';
        });
    })();
  </script>
</body>
</html>
