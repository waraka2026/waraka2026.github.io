          var newFeatures='<div class="app-features"><p><strong>📚 ISBN：</strong>番号入力で書名・著者・表紙を自動取得。</p>\n<p><strong>🗂️ ステータス：</strong>読みたい／読書中／積読／読了を整理し、進捗％も確認。</p>\n<p><strong>✏️ メモ：</strong>ページ番号・重要度タグつきで記録。並び替え、コピー、種類名変更も可能。</p>\n<p><strong>📖 本棚ビュー：</strong>表紙を並べて本棚のように一覧表示。</p>\n<p><strong>☁️ 同期：</strong>ログインで記録を自動同期。機種変更後も引き継ぎ。</p>\n<p><strong>🔍 検索：</strong>タイトル・著者・タグ検索、絞り込み・並び替えに対応。</p></div>';
